[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hat-llm"
version = "0.1.0"
description = "Harness-native training scaffold for governed specialist LLM systems"
readme = "docs/hat-llm.md"
requires-python = ">=3.11"
authors = [{ name = "Danny Hunn" }]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
hf = ["datasets>=2.21"]
training = [
  "datasets>=2.21",
  "transformers>=4.44",
  "jax>=0.4",
  "jaxlib>=0.4",
  "flax>=0.8",
  "optax>=0.2",
  "orbax-checkpoint>=0.6",
]
full = [
  "psycopg[binary]>=3.2",
  "datasets>=2.21",
  "transformers>=4.44",
  "jax>=0.4",
  "jaxlib>=0.4",
  "flax>=0.8",
  "optax>=0.2",
  "orbax-checkpoint>=0.6",
]

[project.scripts]
hat-llm = "hat_llm.build_dataset:main"
hat-llm-train = "hat_llm.jax_train:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
