[app]
name = "SEAL_HAT_LLM"
environment = "development"
log_level = "info"

[database]
dsn = "postgres://postgres:postgres@localhost:5432/llm_harness?sslmode=disable"

[runtime]
specialist_id = "csse-tool-development-specialist-01"
namespace = "memory.csse-tool-development-specialist-01"
slots_root = "./specialists"
config_root = "./config"
store_mode = "shared_dsn"
request_timeout_seconds = 30
default_primary_modality = "text"
allow_text_only_fallback = true
enable_multimodal_smoke_test = true
enable_task_inbox = false
task_inbox_dir = "./artifacts/task_inbox"
task_poll_interval_seconds = 5
enable_task_rpc_server = false
task_rpc_socket_path = "./artifacts/taskrpc/csse-tool-development-specialist-01.sock"

[task_dispatch.remote_unit_sockets]
# "other-specialist-id" = "./artifacts/taskrpc/other-specialist-id.sock"

[embedded_postgres]
data_dir = "./artifacts/embedded_postgres/csse-tool-development-specialist-01"
port = 55432
user = "postgres"
database_name = "postgres"
bin_dir = ""
sql_root = "./sql"

[harness]
auto_create_postmortems = true
auto_update_health = true
default_created_by = "harness:runtime"
