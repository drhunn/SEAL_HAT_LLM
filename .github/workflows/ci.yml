name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llm_harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d llm_harness"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap verify database
        env:
          PGPASSWORD: postgres
        run: ./scripts/bootstrap_verify_db.sh "postgres://postgres:postgres@localhost:5432/llm_harness?sslmode=disable"
      - name: Go build
        run: go build ./...
      - name: Go test
        env:
          TEST_DATABASE_DSN: postgres://postgres:postgres@localhost:5432/llm_harness?sslmode=disable
        run: go test ./...
      - name: Strict verify
        run: go run ./cmd/verify -config config/runtime.example.toml -mode strict

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e .
      - name: Python compile check
        run: python -m compileall python
      - name: Python unit tests
        run: python -m unittest discover -s python/tests
      - name: Build starter HAT dataset
        run: python -m hat_llm.build_dataset --repo-root . --specialist-id csse-tool-development-specialist-01
